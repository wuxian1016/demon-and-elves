<!doctype html><script>
const send = (s) => window.webkit.messageHandlers.log.postMessage(String(s));
const src = new XMLHttpRequest(); src.open('GET', 'c/pf2/art163/screen-tint.js', false); src.send();
const module = { exports: {} }; new Function('module', 'exports', src.responseText)(module, module.exports);
const env = { window: {}, document: { createElement: (t) => document.createElement(t) } };
const realNow = Date.now.bind(Date);
(async () => {
  const results = [];
  for (let run = 0; run < 3; run++) {
    const t = module.exports(env); let m = null, calls = 0, clock = realNow(), adv = 0;
    Date.now = () => (clock += adv);
    while (!m && calls < 30) {
      await new Promise(r => setTimeout(r, 16));
      calls++; adv = (calls === 2 || calls === 4) ? 10 : 0;
      const t0 = performance.now(); m = t.step(); const ms = performance.now() - t0;
      if (calls > 5) results.push('step' + calls + '=' + ms.toFixed(1) + 'ms');
    }
    Date.now = realNow;
    results.push(m + '@' + calls + JSON.stringify(t.probeLog()));
  }
  send('PROBE2 ' + results.join(' ')); send('__DONE__');
})();
</script>
